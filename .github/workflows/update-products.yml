name: Atualizar lista de produtos

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 06h (horário de Brasília)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar produtos no HubSpot
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: python3 scripts/update_products.py
      - name: Commit se mudou
        run: |
          if git diff --quiet products.json; then echo "Sem mudanças"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json
          git commit -m "Atualiza lista de produtos"
          git push
